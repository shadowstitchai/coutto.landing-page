baseurl: ''
url: 'https://coutto.app'
permalink: pretty
title: '纽扣缝纫 - 全能 AI 缝纫工具'

logo:
  mobile: "images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.svg"
  desktop_height: "32px"
  desktop_width: "120px"

home:
  limit_services: 6

collections:
  pages:
    output: true
    permalink: /:path/
  services:
    output: true
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
      sitemap: false
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
      sitemap: false
  - scope:
      path: "about.md"
    values:
      sitemap: false
  - scope:
      path: "contact.md"
    values:
      sitemap: false
  - scope:
      path: "services.md"
    values:
      sitemap: false
  - scope:
      path: "team.md"
    values:
      sitemap: false
  - scope:
      path: "_pages/open.html"
    values:
      sitemap: false
  - scope:
      path: "designer/**/*.html"
    values:
      sitemap: false

sass:
  style: compressed # possible values: nested expanded compact compressed


exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md

ios_app_id: 6797682018
plugins:
  - jekyll-sitemap
include:
  - .well-known
