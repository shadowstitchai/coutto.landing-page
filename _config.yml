baseurl: ''
url: 'https://coutto.app'
permalink: pretty
title: '纽扣缝纫 - 全能 AI 缝纫工具'

# github-pages defaults to jekyll-theme-primer. Its style.css overwrites ours on regen.
theme: null

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_pages/open.html"
    values:
      sitemap: false
  - scope:
      path: "designer/**/*.html"
    values:
      sitemap: false

sass:
  style: compressed # possible values: nested expanded compact compressed


exclude:
  - assets/css/style.scss
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - scripts
  - bin

ios_app_id: 6797682018
plugins:
  - jekyll-sitemap
include:
  - .well-known
