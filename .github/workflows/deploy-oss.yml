name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-oss
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: coutto
      OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
      OSS_REGION: cn-shanghai
      SITE_URL: https://coutto.cn
      OSS_WEBSITE_URL: https://coutto.cn
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Require OSS secrets
        run: |
          if [[ -z "$OSS_ACCESS_KEY_ID" || -z "$OSS_ACCESS_KEY_SECRET" ]]; then
            echo "Add repository Actions secrets OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET." >&2
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install ossutil and gems
        run: ./scripts/setup.sh

      - name: Deploy
        run: ./scripts/deploy-oss.sh

      - name: Check the site
        run: |
          curl -fsS -o /dev/null http://coutto.cn/
          curl -fsS -o /dev/null http://coutto.cn/en/
